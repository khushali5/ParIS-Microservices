version: '3.8'
services:

  postgres:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: partner_db
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - paris-net

  config-server:
    build:
      context: ./ConfigServer/ConfigServer
    container_name: config-server-container
    ports:
      - "8888:8888"
    environment:
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    volumes:
      - ./config-repo:/config-repo
    networks:
      - paris-net

  discovery-server:
    build:
      context: ./discovery-server/discovery-server
    container_name: discovery-server-container
    ports:
      - "8761:8761"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    depends_on:
      - config-server
    networks:
      - paris-net

  api-gateway:
    build:
      context: ./api-gateway/api-gateway
    container_name: api-gateway-container
    ports:
      - "8080:8080"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      - discovery-server
      - config-server
    networks:
      - paris-net

  partner-service:
    build:
      context: ./PartnerService/PartnerService
    container_name: partner-service-container
    ports:
      - "8081:8081"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/partner_db?options=-c%20TimeZone=Asia/Kolkata
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      - postgres
      - discovery-server
      - config-server
    networks:
      - paris-net

  bank-service:
    build:
      context: ./BankService/BankService
    container_name: bank-service-container
    ports:
      - "8082:8082"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bank_db?options=-c%20TimeZone=Asia/Kolkata
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      - postgres
      - discovery-server
      - config-server
    networks:
      - paris-net

networks:
  paris-net:
    driver: bridge

volumes:
  postgres-data: