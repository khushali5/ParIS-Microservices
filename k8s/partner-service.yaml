apiVersion: apps/v1
kind: Deployment
metadata:
  name: partner-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: partner-service
  template:
    metadata:
      labels:
        app: partner-service
    spec:
      containers:
        - name: partner-service
          image: partner-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/partner_db
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discovery-server:8761/eureka/
            - name: SPRING_CONFIG_IMPORT
              value: optional:configserver:http://config-server:8888
---
apiVersion: v1
kind: Service
metadata:
  name: partner-service
spec:
  selector:
    app: partner-service
  ports:
    - port: 8081
      targetPort: 8081